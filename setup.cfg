[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    thirdparty,
    certs
ignore = E203, W503
per-file-ignores =
    __init__.py: F401
    scripts/*: E402
    deskagent/agent/__main__.py: E402
    tests/*: F403, F405, E402

[tool:pytest]
pythonpath = .
testpaths = tests
addopts = --import-mode=importlib
