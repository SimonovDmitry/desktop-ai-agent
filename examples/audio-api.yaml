# Keys: DESKAGENT_AUDIO__STT_API_KEY and DESKAGENT_AUDIO__TTS_API_KEY.
# Set llm.model for your installation, or pass --model on the CLI.
audio:
  enabled: true
  stt_provider: openai
  stt_base_url: https://api.openai.com/v1
  stt_model: whisper-1
  tts_provider: openai
  tts_base_url: https://api.openai.com/v1
  tts_model: tts-1
  api_voice: alloy
  language: ru
